# DEV-030 — lớp kiểm tra khách quan độc lập: build + test + định dạng code cho mọi push/PR vào main.
# 2026-10-12: đã dọn hết cảnh báo cũ (IDE1006 bắt nhầm hằng const) — bước định dạng nay CHẶN như build/test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ParentalGuard.sln

      - name: Build
        run: dotnet build ParentalGuard.sln -c Release --no-restore

      - name: Test
        run: dotnet test ParentalGuard.sln -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Format check
        run: dotnet format ParentalGuard.sln --verify-no-changes --no-restore --verbosity minimal
