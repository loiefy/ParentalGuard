syntax = "proto3";
package parentalguard.ipc.v1;

option csharp_namespace = "ParentalGuard.Ipc.Protocol";

// Nguồn: Architecture/03-ipc-communication.md mục 3 (Approved).
// Envelope + message schema Đợt 0 (handshake/heartbeat/lifecycle/control) và khung Đợt 1
// (inference result/overlay/force-close) đã chốt sẵn field number theo khối 20 số/domain
// để mở rộng không phá vỡ tương thích ngược (ADR-16). Không sửa field number/ý nghĩa field
// đã có — chỉ được thêm field/case mới hoặc "reserved".

message IpcPayload {
  uint64 message_id = 1;
  uint64 correlation_id = 2;
  int64 timestamp_unix_ms = 3;
  ProcessType sender = 4;
  uint32 schema_version = 5;

  oneof body {
    // --- Handshake (10-19) ---
    Hello hello = 10;
    HelloAck hello_ack = 11;

    // --- Heartbeat (20-29) ---
    HeartbeatPing heartbeat_ping = 20;
    HeartbeatAck heartbeat_ack = 21;

    // --- Lifecycle (30-39) ---
    GracefulStopCommand graceful_stop = 30;

    // --- Kênh Vision (40-59, dành 42-59 cho Đợt 5 Pause / Đợt 7 Perf adaptive) ---
    ControlVisionCommand control_vision = 40;
    VisionInferenceResult vision_result = 41;

    // --- Kênh Overlay (60-79, dành 66-79 cho nhu cầu tương lai) ---
    OverlayRectListCommand overlay_rects = 60;
    ForceCloseRequest force_close = 61;
    ShowToastCommand show_toast = 62; // dùng từ Đợt 0 (BE-061b) — tổng quát cho mọi cảnh báo Overlay-channel
    MonitoringStatusUpdate monitoring_status = 63; // Đợt 2, Service → Overlay — trạng thái icon (FE-021)
    IconPositionUpdate icon_position_update = 64; // Đợt 2, Overlay → Service — kết quả kéo-thả icon (FE-020a)
    IconLayoutSync icon_layout_sync = 65; // Đợt 2, Service → Overlay — đẩy lại toàn bộ vị trí icon đã lưu lúc connect

    // --- Kênh UI (80-99) ---
    // Password & Authentication (80-91, Đợt 3) — Architecture/08-password-authentication-architecture.md mục 7
    SetInitialPasswordRequest set_initial_password_req = 80;
    SetInitialPasswordResponse set_initial_password_resp = 81;
    ConfirmRecoveryKeySavedRequest confirm_recovery_req = 82;
    ConfirmRecoveryKeySavedResponse confirm_recovery_resp = 83;
    AuthVerifyRequest auth_verify_req = 84;
    AuthVerifyResponse auth_verify_resp = 85;
    ChangePasswordRequest change_password_req = 86;
    ChangePasswordResponse change_password_resp = 87;
    RecoveryResetRequest recovery_reset_req = 88;
    RecoveryResetResponse recovery_reset_resp = 89;
    AuthStatusQuery auth_status_query = 90;
    AuthStatusResponse auth_status_resp = 91;
    // Pause/Resume (92-97, Đợt 5) — Architecture/02-process-architecture.md mục 3a
    PauseMonitoringRequest pause_monitoring_req = 92;
    PauseMonitoringResponse pause_monitoring_resp = 93;
    ResumeMonitoringRequest resume_monitoring_req = 94;
    ResumeMonitoringResponse resume_monitoring_resp = 95;
    PauseStatusQuery pause_status_query = 96;
    PauseStatusResponse pause_status_resp = 97;
    // Đợt 6, S2 Dashboard — Architecture/03-ipc-communication.md mục 3.7/10-ui-architecture.md mục 5.
    DashboardStatusQuery dashboard_status_query = 98;
    DashboardStatusResponse dashboard_status_resp = 99;

    // --- Kênh Watchdog (100-119), Đợt 4 — 09-anti-tamper-architecture.md mục 3 ---
    WatchdogReportEvent watchdog_report_event = 100;
    WatchdogReportEventAck watchdog_report_event_ack = 101;

    // --- Kênh Uninstaller (120-139), Đợt 4 — 09-anti-tamper-architecture.md mục 5 ---
    // Lưu ý: pipe Uninstaller CÒN dùng lại AuthVerifyRequest/AuthVerifyResponse (field 84/85,
    // khối UI 80-99) qua whitelist message theo pipe (mục 3.1a của 03) — KHÔNG định nghĩa lại.
    UninstallExecuteRequest uninstall_execute_req = 120;
    UninstallExecuteResponse uninstall_execute_resp = 121;

    // --- Kênh UI Dashboard/Settings (140-159), Đợt 6 — Architecture/03 mục 3.7/10-ui-architecture.md mục 5 ---
    // Field 142/143 (AuditLogQuery/Response) và 146-153 (MarkFalsePositive/Config/RemoveWhitelistEntry)
    // thuộc S3/S4 — ngoài phạm vi lượt implement S2 này, chưa định nghĩa message tương ứng ở đây.
    AcknowledgePauseAnomalyRequest ack_pause_anomaly_req = 140;
    AcknowledgePauseAnomalyResponse ack_pause_anomaly_resp = 141;
    AuditChartQuery audit_chart_query = 144;
    AuditChartResponse audit_chart_resp = 145;
  }
}

enum ProcessType {
  PROCESS_TYPE_UNSPECIFIED = 0;
  VISION = 1;
  OVERLAY = 2;
  UI = 3;
  WATCHDOG = 4; // Đợt 4 — Architecture/09-anti-tamper-architecture.md mục 3
  SERVICE = 5; // Service tự khai báo là sender khi chủ động gửi (HelloAck/HeartbeatPing/
               // GracefulStopCommand/ControlVisionCommand/OverlayRectListCommand/ShowToastCommand...)
  UNINSTALLER = 6; // Đợt 4 — ParentalGuard.Uninstaller.exe, Architecture/09 mục 5
}

message Hello {
  ProcessType process_type = 1;
  uint32 pid = 2;
  string executable_path = 3;
  uint32 protocol_version = 4;
}

message HelloAck {
  bool accepted = 1;
  bytes session_key = 2; // rỗng cho Vision/Overlay (khoá persistent bootstrap qua anonymous pipe)
  int64 server_time_unix_ms = 3;
}

message HeartbeatPing {
  uint64 sequence = 1;
  int64 sent_at_unix_ms = 2;
}

message HeartbeatAck {
  uint64 sequence = 1;
  string diagnostic_state = 2;
}

message GracefulStopCommand {
  uint32 deadline_ms = 1;
  string reason = 2;
}

message ControlVisionCommand {
  bool monitoring_enabled = 1;
  uint32 capture_interval_ms = 2;
  float risk_threshold = 3;
  repeated string exclude_process_names = 4;

  reserved 20 to 29; // Đợt 5 (PAUSE-*)
  reserved 30 to 39; // Đợt 7 (PERF-*)
}

message Rect {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message VisionInferenceResult {
  uint64 frame_id = 1;
  fixed64 window_handle = 2;
  uint32 monitor_id = 3;
  float risk_score = 4;
  Rect bbox = 5;
  int64 captured_at_unix_ms = 6;

  reserved 10 to 19; // dành cho IMG-031 nếu mở lại phạm vi
}

message OverlayRectListCommand {
  repeated OverlayRect rects = 1;
  int64 generated_at_unix_ms = 2;

  reserved 10 to 19; // Đợt 2: BE-088/089
}

message OverlayRect {
  fixed64 window_handle = 1;
  Rect rect = 2; // BỎ QUA nếu is_merged=true — Overlay tự resolve bounds toàn màn hình cục bộ
  uint32 monitor_id = 3;
  uint32 overlay_id = 4;
  OverlayReason reason = 5; // chỉ log/debug phía Service — Overlay không rẽ nhánh theo field này

  // --- Đợt 2, BE-088/089: chế độ overlay gộp khi vượt quá 10 overlay đồng thời ---
  bool is_merged = 6; // true = overlay này che TOÀN màn hình chứa window_handle (degraded mode, BE-088)
  repeated fixed64 merged_window_handles = 7; // chỉ set khi is_merged=true — TOÀN BỘ handle vi phạm trên HỆ THỐNG (BE-089)
}

enum OverlayReason {
  OVERLAY_REASON_UNSPECIFIED = 0;
  CONTENT_VIOLATION = 1;
  reserved 2 to 9;
}

message ForceCloseRequest {
  fixed64 window_handle = 1;
  uint32 overlay_id = 2;
  int64 clicked_at_unix_ms = 3;
  CloseSource source = 4; // bổ sung Đợt 2 (BE-089b) — Overlay LUÔN set tường minh, không để mặc định UNSPECIFIED
}

enum CloseSource {
  CLOSE_SOURCE_UNSPECIFIED = 0;
  MANUAL = 1;
  AUTO_TIMEOUT = 2;
}

// --- Đợt 2, FE-020/021/022: icon trạng thái multi-monitor (07-overlay-architecture.md mục 4.1) ---

message MonitoringStatusUpdate {
  IconState state = 1;
  int64 pause_expires_at_unix_ms = 2; // chỉ có ý nghĩa khi state == PAUSED, 0 nếu không áp dụng
  int64 generated_at_unix_ms = 3;
}

enum IconState {
  ICON_STATE_UNSPECIFIED = 0;
  ACTIVE = 1; // Running·Monitoring (kể cả Degraded·FailSecure, ADR-14)
  PAUSED = 2; // Running·Paused
  ERROR = 3; // Starting, hoặc đang respawn Vision/Overlay sau mất heartbeat (BE-023)
}

message IconPositionUpdate {
  string device_name = 1; // MONITORINFOEX.szDevice, vd "\\.\DISPLAY1" — KHÔNG phải monitor_id (OverlayRect field 3)
  int32 x = 2; // toạ độ tuyệt đối góc trên-trái icon form sau khi thả
  int32 y = 3;
}

message IconLayoutSync {
  repeated IconPositionUpdate positions = 1; // toàn bộ vị trí đã lưu, push ngay sau handshake
}

message ShowToastCommand {
  uint32 toast_id = 1; // định danh tăng dần theo Service, dùng đối chiếu log/debug — không phải khoá nghiệp vụ
  string text = 2; // nội dung hiển thị SẴN, Service dựng đầy đủ — Overlay KHÔNG tự dịch/suy luận lại
  ToastSeverity severity = 3;
  string reason_code = 4; // mã lý do machine-readable, vd "CONFIG_FALLBACK_TRIGGERED" — chỉ phục vụ audit log/test
  int64 generated_at_unix_ms = 5;

  reserved 10 to 19; // để ngỏ (vd duration_ms, action button, icon) — không phát minh trước ở đây
}

enum ToastSeverity {
  TOAST_SEVERITY_UNSPECIFIED = 0;
  INFO = 1;
  WARNING = 2;
}

// --- Đợt 3, PWD-0xx: Password & Authentication (field 80-91 của khối UI 80-99) ---
// Nguồn: Architecture/08-password-authentication-architecture.md mục 7 (Approved).
// Mọi field mang plaintext credential dùng `bytes` (UTF-8), không dùng `string` (ADR-73,
// memory hygiene PWD-050/051) — KHÔNG CÒN NGOẠI LỆ (v0.3.0): `recovery_key_plaintext`/
// `new_recovery_key_plaintext` trước đây giữ `string` không có phân tích rủi ro nào biện minh
// cho ngoại lệ — đã sửa sang `bytes` sau audit bảo mật (FAIL 1, security-privacy-auditor Đợt 3),
// xem Architecture/08 mục 5.2/5.5 + ADR-83 cho thời điểm zero cụ thể (khác thời điểm zero của
// credential nội bộ thông thường vì đây là giá trị PHẢI hiển thị 1 lần cho người dùng qua UI).

message AuthStatusQuery {}

message AuthStatusResponse {
  bool password_configured = 1;
}

message SetInitialPasswordRequest {
  bytes password = 1;
  reserved 10 to 15; // Phase 2 (PWD-034), 08 mục 7.6
}

message SetInitialPasswordResponse {
  SetupResult result = 1;
  bytes recovery_key_plaintext = 2; // UTF-8; chỉ set khi result=SUCCESS, hiển thị đúng 1 lần (ADR-83)
  bytes setup_token = 3;
}

// Giá trị enum đặt tiền tố tên type (khác quy ước rút gọn ToastSeverity/OverlayReason/IconState ở
// trên) vì proto3 dùng C++ enum scoping — các giá trị chung như SUCCESS/LOCKED_OUT trùng tên giữa
// nhiều enum *Result bên dưới sẽ xung đột nếu để bare (đã xác nhận qua lỗi build thật lúc implement,
// không đổi field number/ý nghĩa so với Architecture/08 mục 7 — thuần đổi tên định danh enum).
enum SetupResult {
  SETUP_RESULT_UNSPECIFIED = 0;
  SETUP_RESULT_SUCCESS = 1;
  SETUP_RESULT_PASSWORD_TOO_LONG = 2;
  SETUP_RESULT_ALREADY_CONFIGURED = 3;
}

message ConfirmRecoveryKeySavedRequest {
  bytes setup_token = 1;
  bool confirmed = 2;
}

message ConfirmRecoveryKeySavedResponse {
  ConfirmResult result = 1;
}

enum ConfirmResult {
  CONFIRM_RESULT_UNSPECIFIED = 0;
  CONFIRM_RESULT_PERSISTED = 1;
  CONFIRM_RESULT_TOKEN_EXPIRED = 2;
  CONFIRM_RESULT_TOKEN_NOT_FOUND = 3;
}

message AuthVerifyRequest {
  bytes password = 1;
  string action_context = 2; // hằng số quy ước, 08 mục 7.2
  reserved 10 to 15; // Phase 2 (PWD-034)
}

message AuthVerifyResponse {
  AuthResult result = 1;
  bytes action_token = 2; // chỉ set khi result=SUCCESS
  int64 action_token_expires_at_unix_ms = 3;
  int64 lockout_until_unix_ms = 4;
  uint32 consecutive_failures = 5;
}

enum AuthResult {
  AUTH_RESULT_UNSPECIFIED = 0;
  AUTH_RESULT_SUCCESS = 1;
  AUTH_RESULT_WRONG_PASSWORD = 2;
  AUTH_RESULT_LOCKED_OUT = 3;
}

message ChangePasswordRequest {
  bytes old_password = 1;
  bytes new_password = 2;
  bool regenerate_recovery_key = 3;
  reserved 10 to 15; // Phase 2 (PWD-034)
}

message ChangePasswordResponse {
  ChangeResult result = 1;
  bytes new_recovery_key_plaintext = 2; // UTF-8; chỉ set nếu regenerate_recovery_key=true và result=SUCCESS (ADR-83)
}

enum ChangeResult {
  CHANGE_RESULT_UNSPECIFIED = 0;
  CHANGE_RESULT_SUCCESS = 1;
  CHANGE_RESULT_WRONG_OLD_PASSWORD = 2;
  CHANGE_RESULT_LOCKED_OUT = 3;
  CHANGE_RESULT_NEW_PASSWORD_TOO_LONG = 4;
}

message RecoveryResetRequest {
  bytes recovery_key = 1;
  bytes new_password = 2;
  reserved 10 to 15; // Phase 2 (PWD-034)
}

message RecoveryResetResponse {
  RecoveryResetResult result = 1;
  bytes new_recovery_key_plaintext = 2; // UTF-8; chỉ set nếu result=SUCCESS (PWD-032: luôn sinh key mới; ADR-83)
  int64 lockout_until_unix_ms = 3;
}

enum RecoveryResetResult {
  RECOVERY_RESET_RESULT_UNSPECIFIED = 0;
  RECOVERY_RESET_RESULT_SUCCESS = 1;
  RECOVERY_RESET_RESULT_WRONG_RECOVERY_KEY = 2;
  RECOVERY_RESET_RESULT_LOCKED_OUT = 3;
  RECOVERY_RESET_RESULT_NEW_PASSWORD_TOO_LONG = 4;
}

// --- Đợt 5, PAUSE-0xx: Pause/Resume (field 92-97 của khối UI 80-99) ---
// Nguồn: Architecture/02-process-architecture.md mục 3a, Architecture/03-ipc-communication.md mục
// 3.6 (Approved). Giá trị enum *Result đặt tiền tố tên type (cùng lý do đã ghi ở khối Password/Auth
// phía trên — proto3 dùng C++ enum scoping, SUCCESS/INVALID_TOKEN đã bị UninstallResult chiếm bare)
// — protoc-gen-csharp tự rút gọn lại thành PauseResult.Success/InvalidToken/AlreadyPaused,
// ResumeResult.Success/InvalidToken/NotPaused khi sinh code (đã xác nhận qua build thật).

message PauseMonitoringRequest {
  bytes action_token = 1;
  PauseDuration duration = 2;
}

enum PauseDuration {
  PAUSE_DURATION_UNSPECIFIED = 0;
  FIFTEEN_MINUTES = 1;
  THIRTY_MINUTES = 2;
  ONE_HOUR = 3;
  FOUR_HOURS = 4;
  END_OF_DAY = 5; // 23:59:59.999 giờ hệ thống LOCAL, PAUSE-002a — Service tính, KHÔNG phải UI
}

message PauseMonitoringResponse {
  PauseResult result = 1;
  int64 pause_expires_at_unix_ms = 2; // chỉ set khi result=SUCCESS
}

enum PauseResult {
  PAUSE_RESULT_UNSPECIFIED = 0;
  PAUSE_RESULT_SUCCESS = 1;
  PAUSE_RESULT_INVALID_TOKEN = 2; // hết hạn / sai action_context / đã dùng / không tồn tại
  PAUSE_RESULT_ALREADY_PAUSED = 3; // idempotent guard
}

message ResumeMonitoringRequest {
  bytes action_token = 1; // action_context="pause_monitoring" — CÙNG hằng số với Pause (ADR-101)
}

message ResumeMonitoringResponse {
  ResumeResult result = 1;
}

enum ResumeResult {
  RESUME_RESULT_UNSPECIFIED = 0;
  RESUME_RESULT_SUCCESS = 1;
  RESUME_RESULT_INVALID_TOKEN = 2;
  RESUME_RESULT_NOT_PAUSED = 3; // idempotent guard
}

message PauseStatusQuery {}

message PauseStatusResponse {
  bool is_paused = 1;
  int64 pause_expires_at_unix_ms = 2; // 0 nếu không áp dụng
}

// --- Đợt 4, ANTI-0xx: Dual Watchdog + Custom Uninstaller ---
// Nguồn: Architecture/09-anti-tamper-architecture.md mục 8.3 (Approved).

message WatchdogReportEvent {                                  // field 100
  WatchdogEventType event_type          = 1;
  string             target_process      = 2; // "Service" | "Watchdog" — bên vừa được xử lý
  int64              detected_at_unix_ms = 3;
  string             action_taken        = 4; // vd "scm_start", "recreated_registration_then_start" — chỉ để audit log

  reserved 10 to 19; // để ngỏ nếu cần thêm chi tiết chẩn đoán sau này
}

message WatchdogReportEventAck {                                // field 101
  bool received = 1;
}

enum WatchdogEventType {
  WATCHDOG_EVENT_TYPE_UNSPECIFIED       = 0;
  PEER_MISSED_HEARTBEAT_RESTARTED       = 1; // mục 3.4
  PEER_REGISTRATION_MISSING_RECREATED   = 2; // mục 3.4 bước 4
  PEER_REGISTRY_TAMPER_DETECTED_RESTORED = 3; // mục 4.2, khi Watchdog là bên phát hiện
  PEER_RESTART_THRESHOLD_EXCEEDED       = 4; // mục 6.1 — Watchdog-side counter vượt ngưỡng N/T
}

message UninstallExecuteRequest {                               // field 120
  bytes action_token   = 1;
  bool  keep_audit_log = 2;
}

message UninstallExecuteResponse {                              // field 121
  UninstallResult result               = 1;
  string          audit_log_copy_path  = 2; // chỉ set nếu keep_audit_log=true và copy thành công
}

enum UninstallResult {
  UNINSTALL_RESULT_UNSPECIFIED = 0;
  SUCCESS         = 1;
  INVALID_TOKEN   = 2; // hết hạn / sai action_context / đã dùng / không tồn tại
  PARTIAL_FAILURE = 3; // 1+ bước dọn dẹp lỗi — best-effort, KHÔNG rollback (mục 5.5 file 09)
}

// --- Đợt 6, `S2` Dashboard: DashboardStatusQuery/Response, xác nhận cảnh báo pause bất thường,
// biểu đồ audit tổng hợp (field 98-99 + 140-141 + 144-145 của khối UI) ---
// Nguồn: Architecture/03-ipc-communication.md mục 3.7, Architecture/10-ui-architecture.md mục 5/6.2
// (Approved). Field 142/143/146-153 (AuditLogQuery/Response, MarkFalsePositive, Config,
// RemoveWhitelistEntry) thuộc S3/S4 — ngoài phạm vi lượt này, chưa định nghĩa message ở đây.

message DashboardStatusQuery {} // field 98

message DashboardStatusResponse { // field 99
  bool watchdog_alive = 1;
  bool vision_connected = 2;
  string vision_diagnostic_state = 3; // relay nguyên văn HeartbeatAck.diagnostic_state mới nhất — không diễn giải
  bool overlay_connected = 4;
  bool using_fallback_config = 5;
  int64 audit_log_free_disk_bytes = 6;
  bool pause_anomaly_pending_ack = 7; // PAUSE-021, 02 mục 3a.7
}

message AcknowledgePauseAnomalyRequest {} // field 140

message AcknowledgePauseAnomalyResponse { // field 141
  bool acknowledged = 1;
}

message AuditChartQuery { // field 144
  uint32 range_days = 1; // 7 hoặc 30 (FE-071) — Phase 1 chỉ hỗ trợ đúng 2 giá trị này
}

message AuditChartResponse { // field 145
  repeated DailyBlockCount days = 1;
}

message DailyBlockCount {
  string date_utc = 1; // "YYYY-MM-DD"
  uint32 blocked_count = 2; // đếm event_type="ContentBlocked" trong ngày đó
}
